# Сборка релиза: Windows, Linux и Android одним запуском.
#
# Запускается только вручную или по метке версии — не по каждому пушу.
# Публикация на страницу «Releases» должна быть осознанным действием: файлы
# оттуда люди скачивают по постоянным ссылкам из README, и подменять их
# случайным ночным билдом нельзя.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка версии, например v1.1.0"
        required: true
      notes:
        description: "Описание релиза (пусто — сгенерировать из истории коммитов)"
        required: false
      delete_existing:
        description: "Удалить все существующие релизы перед публикацией"
        type: boolean
        default: false

permissions:
  contents: write # нужно, чтобы создать релиз и приложить файлы

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Собрать
        working-directory: src
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: releases/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          # Версию требует сетевой стек: без неё gvisor не собирается.
          go-version: "1.26.x"

      - name: Проверить ядро
        working-directory: android/core
        run: |
          go vet ./...
          go test ./... -race -timeout 300s

      - name: Собрать core.aar
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go get golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 26 \
            -o ../app/libs/core.aar \
            ./mobile

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Ключ подписи лежит в секретах репозитория в виде base64 — двоичному
      # файлу в секрете не место, а текст восстанавливается один в один.
      # Файл кладём за пределы рабочей папки, чтобы он не попал ни в сборку,
      # ни в артефакты.
      - name: Достать ключ подписи
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета ANDROID_KEYSTORE_BASE64 — подписать релиз нечем." >&2
            echo "Заведи его по инструкции в docs/ANDROID_SIGNING.md." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          echo "path=$HOME/release.jks" >> "$GITHUB_OUTPUT"

      - name: Собрать APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ inputs.tag || github.ref_name }}
          # Номер сборки обязан расти. Порядковый номер запуска для этого
          # годится: он никогда не повторяется и не идёт вспять.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Имя без суффикса сборки: на него ссылается постоянная ссылка в README.
      - name: Переименовать и проверить подпись
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ssh_tunnel.apk
          # Без этой проверки неподписанный APK уехал бы в релиз незамеченным:
          # собирается он молча, а спотыкается уже у человека при установке.
          # Версию build-tools не задаём: на серверах она меняется, берём последнюю.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/ssh_tunnel.apk

      - name: Убрать ключ
        if: always()
        run: rm -f "$HOME/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/ssh_tunnel.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      # По умолчанию выключено: разово стирать историю релизов должно быть
      # осознанным выбором при запуске, а не поведением по умолчанию.
      - name: Удалить существующие релизы
        if: ${{ inputs.delete_existing == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            echo "Удаляю релиз $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: releases

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: releases

      # Суммы пересчитываем здесь: APK собирался в другой задаче и в файл от
      # build.sh не попал. Плоские имена — под постоянные ссылки из README.
      - name: Собрать всё вместе
        run: |
          mkdir -p dist
          cp releases/windows/ssh_tunnel.exe dist/
          cp releases/windows/ssh_tunnel_windows.zip dist/
          cp releases/linux/ssh_tunnel_linux dist/
          cp releases/linux/ssh_tunnel_linux_arm64 dist/
          cp releases/ssh_tunnel.apk dist/
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -lh dist

      - name: Опубликовать
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          files: dist/*
