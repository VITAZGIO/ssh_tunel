# Сборка релиза: Windows, Linux и Android одним запуском.
#
# Запускается только вручную или по метке версии — не по каждому пушу.
# Публикация на страницу «Releases» должна быть осознанным действием: файлы
# оттуда люди скачивают по постоянным ссылкам из README, и подменять их
# случайным ночным билдом нельзя.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка версии, например v1.1.0"
        required: true

permissions:
  contents: write # нужно, чтобы создать релиз и приложить файлы

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Собрать
        working-directory: src
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: releases/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          # Версию требует сетевой стек: без неё gvisor не собирается.
          go-version: "1.26.x"

      - name: Проверить ядро
        working-directory: android/core
        run: |
          go vet ./...
          go test ./... -race -timeout 300s

      - name: Собрать core.aar
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go get golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 26 \
            -o ../app/libs/core.aar \
            ./mobile

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Собрать APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # Имя без суффикса сборки: на него ссылается постоянная ссылка в README.
      - name: Переименовать
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/ssh_tunnel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/ssh_tunnel.apk
          if-no-files-found: error

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: releases

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: releases

      # Суммы пересчитываем здесь: APK собирался в другой задаче и в файл от
      # build.sh не попал. Плоские имена — под постоянные ссылки из README.
      - name: Собрать всё вместе
        run: |
          mkdir -p dist
          cp releases/windows/ssh_tunnel.exe dist/
          cp releases/windows/ssh_tunnel_windows.zip dist/
          cp releases/linux/ssh_tunnel_linux dist/
          cp releases/linux/ssh_tunnel_linux_arm64 dist/
          cp releases/ssh_tunnel.apk dist/
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -lh dist

      - name: Опубликовать
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
