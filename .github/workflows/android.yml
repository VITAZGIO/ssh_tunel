# Сборка приложения для Android.
#
# Собирать APK локально нельзя: нужны Android SDK и NDK, а они есть на серверах
# GitHub уже установленными. Здесь из модуля на Go делается библиотека core.aar,
# и уже её подключает приложение.
name: android

on:
  push:
    branches: ["claude/**"]
    paths:
      - "android/**"
      - "src/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          # Версию требует сетевой стек: без неё gvisor не собирается.
          go-version: "1.26.x"

      - name: Проверить ядро
        working-directory: android/core
        run: |
          go vet ./...
          # Тестам нужен /dev/net/tun; те, которым он недоступен, пропускаются.
          go test ./... -race -timeout 300s

      - name: Собрать core.aar
        working-directory: android/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          go get golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          mkdir -p ../app/libs
          # androidapi 26 — та же нижняя граница, что объявлена у приложения.
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 26 \
            -o ../app/libs/core.aar \
            ./mobile
          ls -lh ../app/libs/

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Собрать APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: assembleDebug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: ssh_tunnel_apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
