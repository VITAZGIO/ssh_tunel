<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ssh_tunel</title>
<style>
  :root{
    --bg:#0d1017; --card:#161a23; --card2:#1d222d; --line:#272d3a;
    --text:#e8ebf2; --dim:#828b9e; --accent:#4c8dff;
    --ok:#2fbf71; --warn:#e8b339; --err:#e5484d;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f6; --card:#fff; --card2:#f3f5f9; --line:#dde2ec;
           --text:#141821; --dim:#616b7f; }
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  input{-webkit-user-select:text;user-select:text}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;
       font:14px/1.45 "Segoe UI",-apple-system,Roboto,sans-serif}

  /* ---------- каркас ---------- */
  .app{height:100vh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 6px;flex:none}
  .bar .sp{flex:1}

  /* Логотип в левом верхнем углу, без подписи: название и так стоит в
     заголовке окна. */
  .brand{display:flex;align-items:center}
  .brand svg{display:block;fill:#2de2ff;width:48px;height:auto}
  .ico{width:32px;height:32px;border-radius:8px;border:1px solid transparent;
       display:grid;place-items:center;cursor:pointer;color:var(--dim);
       background:transparent;-webkit-app-region:no-drag}
  .ico:hover{background:var(--card2);color:var(--text)}
  .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
           stroke-linecap:round;stroke-linejoin:round}

  .view{flex:1;overflow-y:auto;padding:0 16px 16px;display:none}
  .view.on{display:block}
  /* Главный экран не прокручивается: кнопка со статусом занимают всё
     свободное место, плитки прижаты к низу окна. */
  #viewMain.on{display:flex;flex-direction:column;overflow:hidden}
  .view::-webkit-scrollbar{width:8px}
  .view::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ---------- главный экран ---------- */
  .middle{flex:1;display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:16px;min-height:0}

  #power{position:relative;width:172px;height:172px;border-radius:50%;
         cursor:pointer;border:2px solid var(--line);background:var(--card);
         color:var(--dim);transition:.25s;font:inherit;padding:0;flex:none}
  /* Знак включения крупный и смещён ниже центра круга — под ним остаётся
     место для подписи, и вместе они читаются как одно целое. */
  #power svg{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
             width:92px;height:92px;fill:none;stroke:currentColor;
             stroke-width:1.9;stroke-linecap:round}
  #power .cap{position:absolute;left:0;right:0;bottom:20px;
              font-size:13px;font-weight:600;letter-spacing:.3px}
  #power:hover{border-color:var(--accent);color:var(--accent)}
  #power:disabled{opacity:.55;cursor:default}

  .status{text-align:center;flex:none}
  .status .s{font-size:18px;font-weight:600}
  .status .d{font-size:12.5px;color:var(--dim);margin-top:2px;cursor:pointer;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status .d:hover{color:var(--accent)}

  #power.on{border-color:var(--ok);color:var(--ok);
            box-shadow:0 0 0 6px rgba(47,191,113,.10),0 0 34px rgba(47,191,113,.22)}
  #power.busy{border-color:var(--warn);color:var(--warn);animation:breathe 1.5s infinite}
  #power.bad{border-color:var(--err);color:var(--err)}
  @keyframes breathe{50%{opacity:.55}}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:none}
  .tile[hidden]{display:none}
  button.btn.speed{width:100%;margin-top:9px;flex:none;padding:9px}
  button.btn.speed .ph{color:var(--dim);font-size:12px;margin-left:6px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:11px;
        padding:9px 12px}
  .tile .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;
           letter-spacing:.6px}
  .tile .v{font-size:16px;font-weight:600;font-family:var(--mono);margin-top:2px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- настройки и журнал ---------- */
  .head{display:flex;align-items:center;gap:9px;padding:2px 0 12px}
  .head .t{font-size:15px;font-weight:650}

  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:3px}
  input[type=text],input[type=number]{width:100%;background:var(--card);
       border:1px solid var(--line);border-radius:8px;padding:7px 10px;
       color:var(--text);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .hint{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.35}

  .chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;
       padding:8px 0;border-top:1px solid var(--line)}
  .chk input{margin-top:2px;flex:none;accent-color:var(--accent)}
  .chk .lbl{font-size:13px}

  button.btn{font:inherit;color:var(--text);background:var(--card2);
       border:1px solid var(--line);border-radius:8px;padding:8px 15px;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent);border-color:var(--accent);
       color:#fff;font-weight:600}

  #log{font-family:var(--mono);font-size:11.5px;background:var(--card);
       border:1px solid var(--line);border-radius:11px;
       height:calc(100vh - 130px);overflow-y:auto;padding:7px 0}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .l{display:flex;gap:8px;padding:2px 11px;white-space:nowrap}
  .l .t{color:var(--dim);flex:none}
  .l .p{flex:none;width:104px;overflow:hidden;text-overflow:ellipsis}
  .l .a{flex:none;color:var(--dim)}
  .l .h{overflow:hidden;text-overflow:ellipsis}
  .l .n{flex:none;color:var(--dim)}
  .l.fail .a,.l.fail .h{color:var(--err)}
  .l .flag{flex:none;color:var(--warn)}
  .l.msg{color:var(--dim);white-space:normal}
  .l.msg.warn{color:var(--warn)} .l.msg.err{color:var(--err)}

  .err-box{background:rgba(229,72,77,.13);border:1px solid var(--err);
           color:var(--err);border-radius:9px;padding:8px 11px;margin:0 0 11px;
           font-size:12.5px;white-space:pre-wrap;display:none}
  .err-box.on{display:block}
  pre{font-family:var(--mono);font-size:11px;background:var(--card);
      border:1px solid var(--line);padding:8px 10px;border-radius:8px;
      overflow-x:auto;margin:6px 0 0;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <div class="brand">
      <svg id="logo" viewBox="0 0 626 520" role="img" aria-label="Vitaz Gio">
        <path d="M0 0 137 449 180 308 86 0Z"/>
        <path d="M159 520 221 520 246 437 354 83 379 0 293 0 190 338 146 479Z"/>
        <path d="M468 520 524 337 437 337 406 437 264 437 239 520Z"/>
        <path d="M554 236 394 236 368 319 442 319 529 319Z"/>
        <path d="M373 83 601 83 626 0 398 0Z"/>
      </svg>
    </div>
    <span class="sp"></span>
    <button class="ico" id="btnLog" title="Журнал">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <button class="ico" id="btnSettings" title="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div class="view on" id="viewMain">
    <div class="err-box" id="error"></div>

    <!-- Кнопка со статусом занимают всё свободное место и центрируются в нём,
         плитки прижаты к низу окна. -->
    <div class="middle">
      <button id="power">
        <svg viewBox="0 0 24 24"><path d="M12 3.2v8.6"/><path d="M6.5 7a8.5 8.5 0 1 0 11 0"/></svg>
        <span class="cap" id="powerCap">Подключить</span>
      </button>

      <div class="status">
        <div class="s" id="stateText">Отключено</div>
        <div class="d" id="stateDetail" title="нажми, чтобы проверить настоящий внешний адрес"></div>
      </div>
    </div>

    <div class="tiles">
      <!-- Плитки со скоростью появляются только после теста: до него
           показывать там нечего. -->
      <div class="tile" id="tileDown" hidden>
        <div class="k">Приём</div><div class="v" id="dn">—</div></div>
      <div class="tile" id="tileUp" hidden>
        <div class="k">Отдача</div><div class="v" id="up">—</div></div>
      <div class="tile"><div class="k">Соединений</div><div class="v" id="act">—</div></div>
      <div class="tile"><div class="k">Каналов SSH</div><div class="v" id="links">—</div></div>
    </div>

    <button class="btn speed" id="speedtest">Тест скорости</button>
  </div>

  <!-- НАСТРОЙКИ -->
  <div class="view" id="viewSettings">
    <div class="head">
      <button class="ico" id="backFromSettings" title="Назад">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="t">Настройки</span>
    </div>

    <div class="err-box" id="setError"></div>

    <div class="field"><label for="host">Адрес VPS</label>
      <input type="text" id="host" placeholder="87.58.210.143" spellcheck="false"></div>
    <div class="field"><label for="user">Пользователь SSH</label>
      <input type="text" id="user" spellcheck="false"></div>
    <div class="field"><label for="keyPath">Приватный ключ</label>
      <input type="text" id="keyPath" spellcheck="false"></div>

    <div class="two">
      <div class="field"><label for="sshPort">SSH-порт</label>
        <input type="number" id="sshPort" min="1" max="65535"></div>
      <div class="field"><label for="poolSize">Каналов SSH</label>
        <input type="number" id="poolSize" min="1" max="16"></div>
    </div>
    <div class="hint" style="margin:-4px 0 10px">Несколько параллельных каналов
      заметно поднимают скорость. 4 — разумное значение.</div>

    <div class="two">
      <div class="field"><label for="socksPort">Порт SOCKS</label>
        <input type="number" id="socksPort" min="1" max="65535"></div>
      <div class="field"><label for="httpPort">Порт HTTP</label>
        <input type="number" id="httpPort" min="1" max="65535"></div>
    </div>

    <label class="chk"><input type="checkbox" id="sysProxy">
      <span class="lbl">Системный прокси Windows
        <div class="hint">Браузеры и приложения на системном сетевом стеке.</div>
      </span></label>

    <label class="chk"><input type="checkbox" id="setEnvVars">
      <span class="lbl">Переменные среды HTTPS_PROXY
        <div class="hint">Нужно для Claude Code, npm, pip, curl — они системный
          прокси не читают. Подхватится терминалами, открытыми после включения.</div>
      </span></label>

    <label class="chk"><input type="checkbox" id="autoStart">
      <span class="lbl">Подключаться сразу при запуске</span></label>

    <label class="chk"><input type="checkbox" id="verbose">
      <span class="lbl">Подробный журнал</span></label>

    <div style="display:flex;gap:9px;align-items:center;margin-top:14px">
      <button class="btn primary" id="save">Сохранить</button>
      <span class="hint" id="savedNote"></span>
    </div>

    <div class="hint" style="margin-top:16px">Если не хочешь менять переменные
      среды глобально — вставь это в терминал перед запуском:</div>
    <pre id="envhint"></pre>
  </div>

  <!-- ЖУРНАЛ -->
  <div class="view" id="viewLog">
    <div class="head">
      <button class="ico" id="backFromLog" title="Назад">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="t">Кто ходит в интернет</span>
      <span style="flex:1"></span>
      <button class="ico" id="clear" title="Очистить">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </button>
    </div>
    <div id="log"></div>
  </div>

</div>

<script>
const T = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
const api = (path, body) => fetch(path, {
  method: body ? 'POST' : 'GET',
  headers: {'X-Token': T, 'Content-Type': 'application/json'},
  body: body ? JSON.stringify(body) : undefined
}).then(r => r.json());

const FIELDS = ['host','user','keyPath','sshPort','socksPort','httpPort','poolSize'];
const CHECKS = ['sysProxy','setEnvVars','verbose','autoStart'];

let running = false, formDirty = false, speedRunning = false;

/* ---------- переключение экранов ---------- */
function show(name){
  ['viewMain','viewSettings','viewLog'].forEach(v =>
    $(v).classList.toggle('on', v === name));
  if(name === 'viewLog') $('log').scrollTop = $('log').scrollHeight;
}
$('btnSettings').onclick = () => show('viewSettings');
$('btnLog').onclick = () => show('viewLog');
$('backFromSettings').onclick = () => show('viewMain');
$('backFromLog').onclick = () => show('viewMain');

/* ---------- форматирование ---------- */
function fmtMbps(v){
  if(v >= 100) return v.toFixed(0) + ' Мбит/с';
  return v.toFixed(1) + ' Мбит/с';
}

/* ---------- состояние ---------- */
const STATES = {
  stopped:      ['Отключено',            'Подключить',  ''    ],
  connecting:   ['Подключаюсь…',         'Отмена',      'busy'],
  connected:    ['Защищено',             'Отключить',   'on'  ],
  reconnecting: ['Связь потеряна',       'Отключить',   'busy'],
  error:        ['Ошибка',               'Подключить',  'bad' ],
};
function setState(s, detail){
  const [text, cap, cls] = STATES[s] || [s, 'Подключить', ''];
  $('stateText').textContent = text;
  if(detail !== undefined) $('stateDetail').textContent = detail || '';
  $('powerCap').textContent = cap;
  $('power').className = cls;
  running = (s === 'connected' || s === 'reconnecting' || s === 'connecting');
  $('speedtest').disabled = !running || speedRunning;
}
function showError(msg, where){
  const box = $(where || 'error');
  box.textContent = msg || '';
  box.classList.toggle('on', !!msg);
}

/* ---------- журнал ---------- */
const logEl = $('log');
let lastKey = null, lastLine = null, lastCount = 1, lastAt = 0;

function addConn(e){
  const key = (e.process||'') + '|' + e.target + '|' + (e.failed?'f':'o');
  const now = Date.now();
  // Одна страница открывает десятки соединений к одному хосту — повторы
  // в пределах пяти секунд сворачиваем в счётчик, иначе журнал нечитаем.
  if(key === lastKey && now - lastAt < 5000 && lastLine){
    lastCount++; lastAt = now;
    lastLine.querySelector('.n').textContent = '×' + lastCount;
    return;
  }
  lastKey = key; lastCount = 1; lastAt = now;

  const d = document.createElement('div');
  d.className = 'l' + (e.failed ? ' fail' : '');
  d.innerHTML = '<span class="t"></span><span class="p"></span><span class="a"></span>'
              + '<span class="h"></span><span class="flag"></span><span class="n"></span>';
  d.querySelector('.t').textContent = new Date(e.time).toLocaleTimeString('ru-RU');
  d.querySelector('.p').textContent = e.process || 'приложение';
  d.querySelector('.a').textContent = e.failed ? '✗' : '→';
  d.querySelector('.h').textContent = e.target + (e.failed ? '  ' + (e.error||'') : '');
  d.querySelector('.flag').textContent = e.dnsLeak ? ' DNS!' : '';
  if(e.dnsLeak) d.querySelector('.flag').title = 'DNS-запрос ушёл мимо туннеля';
  push(d);
}
function addMsg(e){
  lastKey = null;
  const d = document.createElement('div');
  d.className = 'l msg ' + (e.level === 'error' ? 'err' : e.level === 'warn' ? 'warn' : '');
  d.textContent = new Date(e.time).toLocaleTimeString('ru-RU') + '  ' + e.text;
  push(d);
}
function push(el){
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.appendChild(el);
  lastLine = el;
  while(logEl.childElementCount > 600) logEl.removeChild(logEl.firstChild);
  if(atBottom) logEl.scrollTop = logEl.scrollHeight;
}
$('clear').onclick = () => { logEl.innerHTML = ''; lastKey = null; };

/* ---------- поток событий ---------- */
function connectEvents(){
  const es = new EventSource('/events?t=' + encodeURIComponent(T));
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if(e.kind === 'conn')  return addConn(e);
    if(e.kind === 'speed') return onSpeed(e);
    if(e.kind === 'log')   return addMsg(e);
    if(e.kind === 'state'){
      setState(e.state, e.state === 'connected' ? e.detail : '');
      showError(e.state === 'error' ? e.detail : '');
      return;
    }
    if(e.kind === 'stats'){
      const s = e.stats;
      $('act').textContent = s.active;
      $('links').textContent = s.healthy + ' / ' + s.links;
    }
  };
}

/* ---------- кнопка ---------- */
$('power').onclick = async () => {
  $('power').disabled = true;
  showError('');
  try{
    const r = running ? await api('/api/stop', {}) : await api('/api/start', {});
    if(r.error){ showError(r.error); show('viewMain'); }
  } finally {
    $('power').disabled = false;
    refresh();
  }
};

/* Отдельной плитки с внешним адресом больше нет — он и так написан под
   состоянием. Но проверить, что трафик действительно выходит через сервер,
   по-прежнему можно: щелчок по адресу спрашивает его у внешнего сервиса
   ЧЕРЕЗ туннель и показывает, совпал ли он с ожидаемым. */
$('stateDetail').onclick = async () => {
  if(!running) return;
  const shown = $('stateDetail').textContent;
  $('stateDetail').textContent = 'проверяю…';
  const r = await api('/api/checkip');
  if(r.error){
    $('stateDetail').textContent = shown;
    showError(r.error);
    return;
  }
  $('stateDetail').textContent = r.ip === shown ? shown + '  ✓' : r.ip;
  setTimeout(() => { if(running) $('stateDetail').textContent = r.ip; }, 4000);
};

/* ---------- тест скорости ---------- */
/* Замер идёт около двадцати секунд, поэтому показываем не только итог, но и
   ход: плитка нужного направления обновляется прямо во время теста. */
function onSpeed(e){
  if(e.done){
    speedRunning = false;
    $('speedtest').disabled = !running;
    $('speedtest').innerHTML = 'Тест скорости';
    return;
  }
  const tile = e.phase === 'up' ? 'tileUp' : 'tileDown';
  const val  = e.phase === 'up' ? 'up' : 'dn';
  $(tile).hidden = false;
  $(val).textContent = fmtMbps(e.mbps);
  $('speedtest').innerHTML = 'Измеряю…<span class="ph">' +
    (e.phase === 'up' ? 'отдача' : 'приём') + '</span>';
}

$('speedtest').onclick = async () => {
  if(!running || speedRunning) return;
  speedRunning = true;
  $('speedtest').disabled = true;
  $('speedtest').innerHTML = 'Измеряю…<span class="ph">приём</span>';
  $('tileDown').hidden = false; $('tileUp').hidden = false;
  $('dn').textContent = '…'; $('up').textContent = '…';
  showError('');

  const r = await api('/api/speedtest', {});
  speedRunning = false;
  $('speedtest').disabled = !running;
  $('speedtest').innerHTML = 'Тест скорости';
  if(r.error){
    showError(r.error);
    $('dn').textContent = '—'; $('up').textContent = '—';
    return;
  }
  $('dn').textContent = fmtMbps(r.downMbps);
  $('up').textContent = fmtMbps(r.upMbps);
};

/* ---------- настройки ---------- */
[...FIELDS, ...CHECKS].forEach(f => {
  const el = $(f);
  if(el) el.addEventListener('input', () => { formDirty = true; });
});

$('save').onclick = async () => {
  const cfg = {};
  FIELDS.forEach(f => {
    const el = $(f);
    cfg[f] = el.type === 'number' ? parseInt(el.value, 10) || 0 : el.value.trim();
  });
  CHECKS.forEach(f => cfg[f] = $(f).checked);
  const r = await api('/api/config', cfg);
  if(r.error){ showError(r.error, 'setError'); return; }
  showError('', 'setError');
  fillConfig(r.config);
  $('savedNote').textContent = 'сохранено';
  setTimeout(() => $('savedNote').textContent = '', 2000);
};

function fillConfig(cfg){
  FIELDS.forEach(f => { if($(f)) $(f).value = cfg[f] ?? ''; });
  CHECKS.forEach(f => { if($(f)) $(f).checked = !!cfg[f]; });
  formDirty = false;
}

async function refresh(){
  const st = await api('/api/status');
  setState(st.state, st.state === 'connected' ? st.config.host : '');
  // Пока пользователь правит форму, обновление с сервера её не трогает —
  // иначе набранный, но ещё не сохранённый адрес затирался бы.
  if(!formDirty) fillConfig(st.config);
  $('envhint').textContent = (st.envHint || []).join('\n');
}

connectEvents();
refresh();
setInterval(() => { if(!running) refresh(); }, 5000);
</script>
</body>
</html>
